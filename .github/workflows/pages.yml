name: Build and deploy portfolio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm test
      - run: npm run prepare:content
      - run: dotnet build tools/CvExporter --configuration Release
      - run: pwsh tools/CvExporter/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test tests/CvExporter.Tests --configuration Release
      - run: dotnet run --project tools/CvExporter --configuration Release --no-build -- --export-public
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
        if: failure()
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public/browser
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
